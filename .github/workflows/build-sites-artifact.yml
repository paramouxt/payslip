name: Build Sites artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build OpenNext worker
        run: pnpm build:worker

      - name: Bundle final worker upload
        run: pnpm exec wrangler deploy --dry-run --outdir .sites-bundle

      - name: Upload Sites artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiftsync-sites
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true
          path: |
            .open-next
            .openai/hosting.json
            .sites-bundle
            wrangler.jsonc
